## De los tests al diseño: ¿qué queremos medir realmente?

El mejor análisis no puede compensar un mal diseño experimental.

Hoy cambiamos la pregunta:

&gt; Antes de analizar, ¿estamos midiendo algo que realmente importa?

Pasamos de **"¿es significativo?"** a **"¿cuán grande es el efecto y cómo lo detectamos bien?"**

---
class: animated, fadeIn

# Outline

1. El p-valor no basta
2. Tamaño de efecto
3. Conceptos de potencia estadística
4. ¿De qué depende la potencia?
5. Medir el tamaño de efecto: Cohen's *d*
6. Análisis de potencia: ¿qué *n* necesito?


&lt;!-- ========================================================= --&gt;
&lt;!-- BLOQUE 1: EL P-VALOR NO BASTA                              --&gt;
&lt;!-- ========================================================= --&gt;

---
class: animated, fadeIn

## Cuidado al interpretar p-valores

Un estudio sobre un nuevo fármaco para infartos muestra: **p &lt; 0.001**

.pull-left[
✅ **Esto significa únicamente que:**

- El efecto observado es poco probable que ocurra por azar **si asumimos que H0 es cierta**
]

.pull-right[
❌ **No significa que:**

- El efecto sea muy importante
- El efecto sea útil en la vida real
- El efecto sea real
]

---
class: animated, fadeIn

## Por qué el p-valor no basta

1. **Confunde significancia con relevancia**
    - Con tamaños muestrales grandes, efectos triviales pueden ser "significativos"
    - Con tamaños pequeños, efectos grandes pueden no serlo
2. **Depende del diseño**
    - Depende de *n*, de la varianza y del estadístico elegido
    - Es una medida indirecta y muy volátil ante cambios del diseño experimental
3. **No responde a la pregunta científica**
    - p &lt; 0.05 nos dice que el efecto "no parece cosa del azar", pero no dice si importa, ni cuánto cambia el sistema

&lt;!-- ========================================================= --&gt;
&lt;!-- BLOQUE 2: TAMAÑO DE EFECTO                                 --&gt;
&lt;!-- ========================================================= --&gt;

---
class: animated, fadeIn

## ¿Qué es un tamaño de efecto?

**Idea central:** cuantifica *cuánto* difieren los grupos, no solo *si* difieren.

- Mide la magnitud de la diferencia, asociación o impacto de un factor
- El p-valor responde *"¿un efecto tan extremo podría aparecer por azar?"*
- El tamaño de efecto responde *"¿el efecto es pequeño, moderado o grande?"*

&lt;br&gt;

Se expresa en unidades interpretables:

- diferencias estandarizadas (Cohen's *d*)
- proporciones de varianza (η², R²)
- tablas de contingencia (odds ratio, V de Cramer)
- cambios absolutos (diferencia de medias, Δ)

---
class: animated, fadeIn

## Qué aporta el tamaño de efecto

- **Interpretabilidad:** puedes comunicar *"el tratamiento reduce X en un 20%"* o *"los grupos difieren 0.8 SD"*, y comparar entre estudios y contextos
- **Base para decidir:** en biología, medicina o ciencias sociales guía si una intervención es útil, relevante o coste-efectiva
- **Permite planificar estudios:** la potencia requiere un tamaño de efecto esperado; sin él no se puede calcular un *n* adecuado
- **Es estable y generalizable:** no depende fuertemente de *n*; refleja la estructura real del fenómeno, no el azar de la muestra

## Potencia estadística

.pull-left[
&lt;img src="11_files/figure-html/fig-sol-obs2-1.png" alt="" width="432" style="display: block; margin: auto;" /&gt;
]

.pull-right[
- **Potencia** (*power*) es la probabilidad de rechazar correctamente la hipótesis nula

- También puedes decir que **potencia** es la probabilidad de obtener un p-valor pequeño (&lt; 0.05) **cuando sí hay una diferencia real**

- Potencia = 1 − β, donde β es la probabilidad de un falso negativo

]


---
class: animated, fadeIn

## Sin diferencia real, la potencia no aplica

- Si no hubiera diferencia entre la dieta especial y la normal, y compartieran la misma distribución, la hipótesis nula de que las dos muestras vienen de la misma distribución sería correcta
- El concepto de *potencia* no aplica en esta situación: si H0 es cierta, solo la rechazaremos por error con probabilidad α

&lt;img src="11_files/figure-html/fig-comun-1.png" alt="" width="864" style="display: block; margin: auto;" /&gt;

&lt;!-- ========================================================= --&gt;
&lt;!-- BLOQUE 4: ¿DE QUÉ DEPENDE LA POTENCIA?                     --&gt;
&lt;!-- ========================================================= --&gt;

---
class: animated, fadeIn

## Recordando: α y β en el mismo esquema

.pull-left[
- Ya vimos este esquema en el tema de inferencia
- Ahora podemos leerlo también en clave de **potencia**: la potencia es el área bajo `\(H_A\)` a la derecha de *c*, es decir, `\(1-\beta\)`
- Esquema para un test **unilateral** (α = 0.05, *c* = 1.645). En un test bilateral, α se reparte entre las dos colas (*c* = ±1.96)
]

.pull-right[
&lt;img src="11_files/figure-html/fig-alfa-beta-1.png" alt="" width="576" style="display: block; margin: auto;" /&gt;
]

**Compromiso:** si somos más exigentes (α más pequeño, p. ej. 0.01 en vez de 0.05), *c* se mueve a la derecha: α baja, pero β sube y la potencia baja. La única forma de reducir β **sin subir α** es aumentar *n* o el tamaño de efecto.

---
class: animated, fadeIn

## Recordando: Tipos de errores

Si realizamos un test y decidimos **rechazar o no H₀**, existen cuatro posibles resultados:

| Decisión | H₀ cierta | H&lt;sub&gt;A&lt;/sub&gt; cierta |
|--------------------|---------------|-----------------|
| **No rechazamos H₀**   | Correcto (1-α)   | Error tipo II (β), falso negativo        |
| **Rechazamos H₀**       | Error tipo I (α), falso positivo       | Correcto (1-β) = potencia   |

- **Error tipo I (`\(\alpha\)`)**:
rechazamos la H₀ cuando es verdadera  
- **Error tipo II (`\(\beta\)`)**: no rechazamos H₀ cuando es falsa

&lt;br&gt;
**Ejemplo:**

- El medicamento no tiene un efecto y por lo tanto no hay diferencias en la presión arterial, pero en nuestra muestra los valores están tan alejados que por error pensamos que sí hay un efecto del medicamento.

- El medicamento sí tiene un efecto, y por lo tanto sí hay diferencias en la presión arterial, pero nuestra muestra no muestra diferencias claras: no rechazamos H₀ y nos perdemos un efecto que sí existe 

---
class: animated, fadeIn

## Recordando: Tipos de errores

### Clasificaciones incorrectas

- **Falso positivo (Error tipo I)**: rechazamos H₀ cuando es verdadera  
  - Si H₀ es cierta, ocurre en una proporción α **de las veces que repitiéramos el estudio** (5% si α = 0.05)

- **Falso negativo (error tipo II)**: no rechazamos H₀ aunque H₀ sea falsa  
  - Suele ocurrir si hay **muy pocos datos** o métodos poco sensibles  
  - Se reduce **aumentando el tamaño de muestra** o usando métodos con **mayor potencia estadística**


---
class: animated, fadeIn

## La potencia depende de dos factores

.pull-left[
.center[**Poco solapamiento**]
&lt;img src="11_files/figure-html/fig-f1-1.png" alt="" width="432" style="display: block; margin: auto;" /&gt;
]

.pull-right[
.center[**Mucho solapamiento**]
&lt;img src="11_files/figure-html/fig-f2-1.png" alt="" width="432" style="display: block; margin: auto;" /&gt;
]

1. Cuánto solapan las distribuciones (distancia entre medias y desviación típica)
2. El tamaño de la muestra

&gt; Objetivo habitual: una **potencia de 0.8** (80% de probabilidad de detectar un efecto real). Si solapan poco, basta una *n* pequeña; si solapan mucho, necesitamos una *n* más grande.

---
class: animated, fadeIn

## Efecto del tamaño de muestra

Cada marca es la **media de una muestra** de tamaño *n* (el experimento se repite muchas veces). Con más *n*, las medias se concentran alrededor de la media poblacional y solapan menos.

&lt;img src="11_files/figure-html/fig-n-1.png" alt="" width="864" style="display: block; margin: auto;" /&gt;

---
class: animated, fadeIn

## ¿Cómo determinamos el tamaño de muestra?

- Con una *n* demasiado **pequeña**, podemos no detectar un efecto real (baja potencia, error de tipo II)
- Con una *n* demasiado **grande**, gastamos recursos innecesariamente, y cualquier diferencia trivial sale significativa

¿Cómo encontramos la *n* adecuada?

&gt; Para responder, primero necesitamos resumir en un número cuánto solapan las distribuciones: el **tamaño de efecto**

&lt;!-- ========================================================= --&gt;
&lt;!-- MEDIR EL TAMAÑO DE EFECTO: COHEN'S d         --&gt;
&lt;!-- ========================================================= --&gt;

---
class: animated, fadeIn

## Tamaño de efecto: Cohen's *d*

.pull-left[
`$$d = \frac{\bar{x}_1 - \bar{x}_2}{s_p}$$`

donde `\(s_p\)` es la desviación típica combinada (*pooled*)

**Ejemplo:** diferencia de medias = 10 y `\(s_p\)` = 6.5

`$$d = \frac{10}{6.5} \approx 1.5$$`
]

.pull-right[
&lt;img src="11_files/figure-html/fig-d15-1.png" alt="" width="432" style="display: block; margin: auto;" /&gt;
]

---
class: animated, fadeIn, R

## Cohen's *d* en `R`

.pull-left[
La función `cohens_d()` del paquete **`effectsize`** calcula la *d* de Cohen directamente. Hay que instalar el paquete (`install.packages("effectsize")`) y cargarlo con `library(effectsize)`.

Se escribe con la misma fórmula que `t.test()`: `respuesta ~ grupos`. Por defecto usa la desviación típica combinada `\(s_p\)`.

**Ejemplo:** peso seco de plantas control (`ctrl`) y con un tratamiento (`trt2`), 10 plantas por grupo (`PlantGrowth`)
]

.pull-right[



``` r
library(effectsize)

cohens_d(weight ~ group, data = plantas)
```

```
Cohen's d |         95% CI
--------------------------
-0.95     | [-1.87, -0.01]

- Estimated using pooled SD.
```

- *d* = −0.95: el signo solo indica el orden de la resta (`ctrl` − `trt2`); lo que importa es el **valor absoluto**
- Además da el **IC 95%** de *d*: con 10 plantas por grupo, la estimación es muy imprecisa
]

---
class: animated, fadeIn

## Cohen's *d*: regla de oro vs. contexto

.pull-left[
**Regla de Cohen (guía rápida)**

- d &lt; 0.2 → trivial
- 0.2 ≤ d &lt; 0.5 → pequeño
- 0.5 ≤ d &lt; 0.8 → medio
- d ≥ 0.8 → grande
]

.pull-right[
⚠️ **Advertencia**

No caigamos en la misma trampa que con los p-valores: no categorices el efecto en "pequeño / medio / grande" de forma rígida.

La relevancia práctica depende del contexto, el coste y el impacto.
]

---
class: animated, fadeIn

## Cómo interpretar el tamaño de efecto: ¡todo es relativo!

1. **Investigación previa**
    - Comparar con estudios anteriores: si lo habitual es *d* = 0.5 y tu intervención logra *d* = 1, el efecto es enorme
2. **Expectativas teóricas**
    - Según la teoría, ¿qué tamaño de efecto es razonable? En trastornos difíciles de tratar, un efecto medio ya se considera éxito
3. **Relevancia práctica**
    - Un efecto pequeño puede ser muy importante si es barato, fácil de aplicar o impacta a muchas personas
    - Ej.: la aspirina → efecto pequeño, beneficio enorme

class: animated, fadeIn

## Análisis de potencia

Ya sabemos **medir** el tamaño de efecto. Volvemos a la pregunta: ¿qué *n* necesito?

&gt; Un análisis de potencia determina qué tamaño de muestra asegura una probabilidad alta de rechazar correctamente la hipótesis nula de que no hay diferencias entre los dos grupos

--

Relaciona **cuatro** cantidades:

- Significancia **α**
- **Potencia** (1 − β)
- **Tamaño de efecto** (*d*)
- Tamaño de muestra ***n***


---
class: animated, fadeIn

## Tres decisiones antes de calcular *n*

1. **Potencia** (entre 0 y 1): decidimos 0.8, es decir, un 80% de probabilidad de rechazar correctamente H0
2. **Significancia** α (entre 0 y 1): decidimos 0.05
3. **Tamaño de efecto esperado** *d*: resume el solapamiento entre las distribuciones (distancia entre medias y desviación típica)

Las tres se deciden **a priori**, antes de hacer el experimento


---
class: animated, fadeIn

## ¿Qué *n* necesita mi experimento?

`$$n = \frac{2\,(Z_{\alpha/2} + Z_{\beta})^2}{d^2} \quad \text{por grupo}$$`

.pull-left[
- `\(Z_{\alpha/2}\)`: deja α/2 en cada cola de `\(H_0\)` (test bilateral)
  - α = 0.05 → `qnorm(0.975)` = **1.96**
  - α = 0.01 → `qnorm(0.995)` = **2.58**
- `\(Z_{\beta}\)`: deja β en la cola de `\(H_A\)`
  - potencia 80% → `qnorm(0.80)` = **0.84**
  - potencia 90% → `qnorm(0.90)` = **1.28**
]

.pull-right[
¿De dónde sale? Entre las medias de `\(H_0\)` y `\(H_A\)` tiene que haber `\(Z_{\alpha/2} + Z_\beta\)` errores estándar:

`$$\frac{\Delta}{\sigma\sqrt{2/n}} = Z_{\alpha/2} + Z_\beta$$`

β está siempre en **una sola cola** de `\(H_A\)`: por eso `\(Z_\beta\)` es igual en tests unilaterales y bilaterales.
]

---
class: animated, fadeIn

## Calculadora de tamaño de muestra

.pull-left[

``` r
power.t.test(delta = 1.5, sd = 1,
             sig.level = 0.05, power = 0.8)
```

```

     Two-sample t test power calculation 

              n = 8.06031
          delta = 1.5
             sd = 1
      sig.level = 0.05
          power = 0.8
    alternative = two.sided

NOTE: n is number in *each* group
```

- *n* = 8.06 → **9 por grupo**
- Como *d* ya está en desviaciones típicas, damos `delta = d` y `sd = 1` (por ejemplo, la *d* que da `cohens_d()`)
- La fórmula con Z da ≈ 7: es una aproximación normal, y con muestras pequeñas la *t* necesita más datos
]

.pull-right[
&lt;img src="11_files/figure-html/fig-pot-n-1.png" alt="" width="432" style="display: block; margin: auto;" /&gt;
]

---
class: animated, fadeIn

## Al revés: ¿qué potencia tiene mi experimento?

Si el *n* ya está fijado (un experimento ya hecho, o un presupuesto limitado), despejamos `\(Z_\beta\)` de la misma relación:

.pull-left[
`$$Z_\beta = d\,\sqrt{\frac{n}{2}} - Z_{\alpha/2} \qquad\qquad \text{Potencia} = P(Z \le Z_\beta)$$`

**Ejemplo:** *d* = 0.8, *n* = 20 por grupo, α = 0.05

`$$Z_\beta = 0.8 \times \sqrt{\frac{20}{2}} - 1.96 = 2.53 - 1.96 = 0.57$$`

`$$\text{Potencia} = P(Z \le 0.57) = 0.72$$`

&gt; Con 20 por grupo no llegamos al 80%
]

.pull-right[

``` r
power.t.test(n = 20, delta = 0.8, sd = 1,
             sig.level = 0.05)$power
```

```
[1] 0.6933994
```

- Ahora damos `n` y no damos `power`: `R` calcula la potencia
- `R` da 0.69, algo menos que a mano: igual que con *n*, la *t* es un poco más exigente que la normal con muestras pequeñas
]

## Resumen

- Un p-valor pequeño no dice si el efecto **importa**: hace falta un **tamaño de efecto** (Cohen's *d*)
- **Potencia** = probabilidad de rechazar H0 cuando hay una diferencia real (1 − β)
- Depende del **solapamiento** entre distribuciones (diferencia de medias y desviación típica) y del **tamaño de muestra**
- Se decide **a priori**: potencia (0.8), α (0.05) y tamaño de efecto esperado → *n*
