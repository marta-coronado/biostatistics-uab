## Herramientas para comparar distribuciones visualmente

Normalmente, tenemos datos y queremos encontrar la distribución “adecuada” para ellos. Eso significa que queremos hallar una distribución que **modele** los datos de manera apropiada. El flujo de trabajo debería ser algo así:

1. Ajusta tus datos a una distribución que consideres plausible. Veremos cómo hacer esto en `R`. El ajuste te dará los mejores parámetros para esa distribución, dados tus datos.
2. Compara visualmente la distribución teórica con tus datos. La teórica, en este caso, es el ajuste que acabas de obtener. En la visualización, un buen ajuste no muestra desviaciones sistemáticas de los puntos de datos respecto a la teórica.
3. Haz lo mismo con otras distribuciones plausibles.
4. Decide cuál ajuste te parece el mejor.

### Herramientas para comparar distribuciones visualmente

- **Distribucion acumulativa empírica**. Para cada valor, indica la probabilidad de que una observación sea menor o igual a ese valor.

&lt;img src="8.VisDistr_files/figure-html/unnamed-chunk-3-1.png" width="396" style="display: block; margin: auto;" /&gt;

--
- La distribución empírica se calcula a partir de los datos y muestra pequeños "saltos" en cada observación.

### Herramientas para comparar distribuciones visualmente

- **Distribución acumulativa teórica**: Para cada valor, muestra la probabilidad que esperaríamos de que una observación sea menor o igual a ese valor.

&lt;img src="8.VisDistr_files/figure-html/unnamed-chunk-4-1.png" width="396" style="display: block; margin: auto;" /&gt;


- Al usar este tipo de gráficos para comparar distribuciones, es más fácil identificar desviaciones respecto a lo esperado.

class: animated, fadeIn

### Herramientas para comparar distribuciones visualmente

- **QQ-plot**: gráfico que compara los cuantiles de un conjunto de datos observados con los cuantiles de una distribución teórica. Evaluar visualmente si los datos siguen una distribución específica. Por defecto, asume la distribución normal estándard.

&lt;img src="8.VisDistr_files/figure-html/unnamed-chunk-5-1.png" width="396" style="display: block; margin: auto;" /&gt;

- El cuantil 25 indica el valor `\(k\)` por debajo del cual se encuentra el 25% de los datos.
- Cuando la distribución teórica y los datos muestreados son similares, los puntos del QQ-plot se alinean sobre la línea de referencia.

class: animated, fadeIn

#### QQ-plot: comprobar si una distribución sigue la normal

.pull-left[

``` r
# Simular datos
set.seed(123)
n &lt;- 200
mean_size &lt;- 5
sd_size &lt;- 1
frog_size &lt;- rnorm(n, 
                   mean = mean_size, 
                   sd = sd_size)
data &lt;- data.frame(frog_size = frog_size)

# Crear QQ-plot
ggplot(data, aes(sample = frog_size)) +
  stat_qq(distribution = qnorm, color = "cadetblue4") +
  stat_qq_line(distribution = qnorm, 
               dparams = list(mean = 0, sd = 1), 
               color = "firebrick4", 
               linetype = "dashed", size = 1) + 
  labs(
    title = "QQ-plot",
    x = "Cuantiles teóricos",
    y = "Cuantiles muestrales"
  ) 
```
]
.pull-right[
&lt;img src="8.VisDistr_files/figure-html/unnamed-chunk-7-1.png" width="432" style="display: block; margin: auto;" /&gt;
]

### Comprobar si los datos siguen una distribución normal

.pull-left[
**QQ-plot**
- Método gráfico para comparar dos distribuciones de probabilidad a través de sus cuantiles.  
- Si las distribuciones son similares, los puntos caen cerca de la línea `\(y=x\)`.  
- Se utiliza principalmente para comprobar si los datos siguen una distribución normal.

]
.pull-right[
**Test de Shapiro–Wilk**
- Suposición base (hipótesis nula): los datos se distribuyen de manera normal.  
- Si el test es significativo (*p* &lt; 0.05), los datos no siguen una distribución normal.  
- Muy sensible al tamaño de muestra: con muestras grandes puede detectar desviaciones muy pequeñas de la normalidad, mientras que con muestras pequeñas puede no detectar desviaciones importantes.
]

---
class: animated, fadeIn

#### Test de Shapiro-Wilk en `R`

.pull-left[


``` r
set.seed(10)
vector_normal &lt;- rnorm(n = 5000, 
                       mean = 20, sd = 2)
shapiro.test(vector_normal)
```

```
## 
## 	Shapiro-Wilk normality test
## 
## data:  vector_normal
## W = 0.99967, p-value = 0.6137
```

&lt;img src="8.VisDistr_files/figure-html/unnamed-chunk-9-1.png" width="216" style="display: block; margin: auto;" /&gt;


- Datos distribuidos de manera normal

]

.pull-right[



``` r
set.seed(10)
vector_exp &lt;- rexp(n = 500, 
                   rate = 0.5) 
shapiro.test(vector_exp)
```

```
## 
## 	Shapiro-Wilk normality test
## 
## data:  vector_exp
## W = 0.84433, p-value &lt; 2.2e-16
```

&lt;img src="8.VisDistr_files/figure-html/unnamed-chunk-11-1.png" width="216" style="display: block; margin: auto;" /&gt;

- Datos no distribuidos de manera normal

]

## Resumen

### Muestreo y distribuciones
- En estadística, los experimentos se consideran como procesos de muestreo. Muestrear significa “extraer eventos” de una población de interés. Si los eventos se extraen de manera aleatoria e independiente, los resultados tienen más probabilidades de representar adecuadamente la realidad.
- Una distribución de probabilidad asigna probabilidades a los posibles resultados (en distribuciones continuas: a intervalos de resultados).
- Las distribuciones discretas dan probabilidades para resultados discretos, por ejemplo, conteos. En las distribuciones continuas, a cada valor se le asigna una densidad, y las probabilidades se calculan integrando la densidad en el intervalo de interés.

### Distribuciones comunes en datos biológicos
- La distribución binomial modela el número de éxitos en una serie de ensayos.
- La distribución de Poisson se utiliza a menudo para modelar datos de conteo. Supone que los conteos ocurren sobre un volumen o periodo de tiempo fijo. Es una aproximación de la distribución binomial.
- La distribución gaussiana o normal modela mediciones repetidas de lo mismo y es una distribución continua.
